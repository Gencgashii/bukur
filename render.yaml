# BUKUR WORLD — Render blueprint
# Architecture: React storefront/admin on Vercel + Express API (server/) on
# Render + PostgreSQL.
#
# This blueprint is set up for the FREE smoke-test stage:
#   - the API runs on Render's FREE web plan (spins down after ~15 min idle;
#     first request after that cold-starts in ~30-60s)
#   - PostgreSQL is EXTERNAL (e.g. Neon free tier) — no `databases:` block here.
#     Paste the connection string into DATABASE_URL and set DATABASE_SSL=true.
#
# To go production later: change `plan: free` -> `plan: starter` and (optionally)
# add back a Render database — see the commented block at the bottom of this file.
#
# This does NOT deploy my-medusa-store/. Deploy nothing automatically — review,
# set the "sync: false" secrets in the Render dashboard, then apply.

services:
  # ---------------------------------------------------------------------------
  # Express API  (server/index.js)
  # ---------------------------------------------------------------------------
  - type: web
    name: bukur-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: npm run server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # EXTERNAL PostgreSQL connection string (Neon / Supabase / etc.).
      # e.g. postgresql://user:pass@ep-xxx.eu-central-1.aws.neon.tech/bukur?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Managed Postgres providers (Neon, Supabase, Render external URL, …)
      # require TLS. Set this to "true". Use "strict" to also verify the cert.
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      # REQUIRED: comma-separated allowed browser origin(s), no trailing slash.
      # Include BOTH the storefront and the admin dashboard origins,
      # e.g. https://bukurworld.com,https://www.bukurworld.com,https://admin.bukurworld.com
      - key: CLIENT_ORIGINS
        sync: false
      # If the admin dashboard is hosted on a DIFFERENT domain than this API,
      # set this to "none" (cookies are already Secure in production).
      - key: ADMIN_COOKIE_SAMESITE
        value: "lax"
      # Media storage for ADMIN-UPLOADED images only (storefront photography is
      # a build-time pipeline: public/media/*.{avif,webp,jpg}, served static).
      #
      # SMOKE TEST: "local" — the API boots with no object storage; admin image
      # uploads work but do NOT survive a redeploy (Render's disk is ephemeral).
      # PRODUCTION: change to "s3" and fill every S3_* var below (Cloudflare R2
      # etc.). With "s3" and any S3_* missing the API fails to boot (fail-closed).
      - key: STORAGE_DRIVER
        value: "local"
      # Public read base for stored objects (no trailing slash). e.g.
      # https://img.bukurworld.com  or  https://<bucket>.s3.<region>.amazonaws.com
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Optional: only for non-AWS S3-compatible providers (Cloudflare R2, MinIO).
      # e.g. https://<accountid>.r2.cloudflarestorage.com  — omit for AWS S3.
      - key: S3_ENDPOINT
        sync: false
      # Optional: "true"/"false"; defaults to true when S3_ENDPOINT is set.
      - key: S3_FORCE_PATH_STYLE
        sync: false
      # Only used by the 'local' driver (dev). Harmless to leave unset for s3.
      - key: MEDIA_PUBLIC_BASE_URL
        sync: false
      # Shipping rates in cents by ISO-2 country code.
      - key: SHIPPING_RATES
        value: "XK:180,AL:480"
      # Tax in basis points (0 = none). Set only when the business confirms VAT.
      - key: TAX_RATE_BPS
        value: "0"
      - key: ENABLE_COD
        value: "true"
      # Online card payments (TEB). Keep "teb"; the mock provider is dev-only
      # and is force-disabled when NODE_ENV=production regardless.
      - key: PAYMENTS_CARD_PROVIDER
        value: "teb"
      # Transactional order-confirmation email. Sent server-side only.
      # SMOKE TEST: "false" — orders still succeed, confirmation is recorded as
      # "skipped". PRODUCTION: set "true", keep EMAIL_PROVIDER=resend, and fill
      # EMAIL_FROM + RESEND_API_KEY (else the API fails to boot). console/memory
      # providers are rejected at boot when NODE_ENV=production.
      - key: EMAIL_ENABLED
        value: "false"
      - key: EMAIL_PROVIDER
        value: "resend"
      # "BUKUR WORLD <orders@your-verified-domain.com>" — domain must be
      # verified (SPF/DKIM) with the provider.
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      # Optional absolute https base for links inside the confirmation email.
      - key: EMAIL_STORE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Leave unset in normal operation. Set to "true" only for the one-off
      # first-admin bootstrap, then remove.
      - key: ALLOW_ADMIN_REGISTER
        sync: false

  # ---------------------------------------------------------------------------
  # The React storefront (+ /admin) is deployed on VERCEL, not Render.
  # Vercel: framework "Create React App" (auto), build `npm run build`,
  # output `build/`, SPA rewrite -> /index.html (see vercel.json).
  # Set these in the Vercel project (Production env):
  #   REACT_APP_API_URL        = https://<this API service>.onrender.com
  #   REACT_APP_BANK_HOLDER / _IBAN / _NAME / _SWIFT   (public checkout copy)
  #   GENERATE_SOURCEMAP=false   DISABLE_ESLINT_PLUGIN=true
  # `scripts/check-frontend-env.js` (npm prebuild) fails the Vercel build if
  # REACT_APP_API_URL is missing or points at localhost.
  # ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# DATABASE
#
# Smoke-test stage: use an EXTERNAL free Postgres (Neon recommended — no card,
# no 30-day expiry). Create the project, copy the connection string into the
# API service's DATABASE_URL (sync: false) and keep DATABASE_SSL=true.
#
# Production: either keep the external Postgres on a paid tier, or provision a
# Render Managed database by un-commenting the block below, changing the API
# service to `plan: starter`, and switching DATABASE_URL back to:
#     - key: DATABASE_URL
#       fromDatabase:
#         name: bukur-db
#         property: connectionString
#
# databases:
#   - name: bukur-db
#     plan: starter
#     databaseName: bukur
#     user: bukur
#
# BACKUPS (either provider): run `npm run db:backup` on a schedule from an ops
# context and copy each dump to storage OUTSIDE the container. Never restore
# over the live DB — restore into a clean DB, verify with
# `npm run db:verify-restore`, then repoint. Full runbook: docs/DATABASE-RECOVERY.md.
# ---------------------------------------------------------------------------
