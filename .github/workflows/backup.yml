name: Database Backup

on:
  schedule:
    # 02:00 UTC daily — adjust if you want a different time.
    - cron: '0 2 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Ensure pg_dump is available
        run: which pg_dump || sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run pg_dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/backup-db.js

      - name: Upload backup as an artifact (off-container storage)
        uses: actions/upload-artifact@v4
        with:
          name: bukur-db-backup-${{ github.run_id }}
          path: backups/
          retention-days: 90
