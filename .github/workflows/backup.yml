name: Database Backup

on:
  schedule:
    # 02:00 UTC daily — adjust if you want a different time.
    - cron: '0 2 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # Neon runs PostgreSQL 17. pg_dump refuses to dump a server newer than
      # itself, and ubuntu-latest's default postgresql-client is v16 — so pull
      # the matching v17 client from the official PGDG apt repo instead.
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      # A single failed attempt is not necessarily a broken pipeline — Neon's
      # free tier can suspend an idle database and take a moment to resume,
      # and any hosted-Postgres connection can hit a transient blip. Retry a
      # few times with a short backoff before treating it as a real failure.
      # pg_dump's own stderr is never swallowed (scripts/backup-db.js pipes it
      # straight through), so the exact reason for any failure is visible in
      # this step's log — never in a secret-bearing form.
      - name: Run pg_dump (retries on transient failure)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          attempt=1
          max_attempts=3
          until node scripts/backup-db.js; do
            status=$?
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::pg_dump failed after $attempt attempt(s), exit code $status. See the log above for the real reason (never a secret value)."
              exit "$status"
            fi
            echo "::warning::pg_dump attempt $attempt failed (exit code $status). Retrying in 30s (attempt $((attempt + 1))/$max_attempts)..."
            attempt=$((attempt + 1))
            sleep 30
          done

      # Fail loudly (not just "artifact missing") if the dump + checksum are
      # not both present and self-consistent — catches a partial/corrupt dump
      # before it's ever uploaded as if it were a good backup.
      - name: Verify the dump against its own checksum
        run: |
          set -e
          dump_file=$(ls backups/bukur-db-*.dump 2>/dev/null | head -n1)
          if [ -z "$dump_file" ]; then
            echo "::error::No backup dump file found in backups/ after pg_dump reported success."
            exit 1
          fi
          if [ ! -f "${dump_file}.sha256" ]; then
            echo "::error::Dump exists but its .sha256 sidecar is missing: ${dump_file}"
            exit 1
          fi
          cd backups && sha256sum -c "$(basename "$dump_file").sha256"
          echo "Verified: $dump_file ($(du -h "$(basename "$dump_file")" | cut -f1))"

      - name: Upload backup as an artifact (off-container storage)
        uses: actions/upload-artifact@v4
        with:
          name: bukur-db-backup-${{ github.run_id }}
          path: backups/
          retention-days: 90
          if-no-files-found: error
