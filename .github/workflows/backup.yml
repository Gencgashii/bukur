name: Database Backup

on:
  schedule:
    # 02:00 UTC daily — adjust if you want a different time.
    - cron: '0 2 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # Neon runs PostgreSQL 17. pg_dump refuses to dump a server newer than
      # itself, and ubuntu-latest's default postgresql-client is v16 — so pull
      # the matching v17 client from the official PGDG apt repo instead.
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Run pg_dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/backup-db.js

      - name: Upload backup as an artifact (off-container storage)
        uses: actions/upload-artifact@v4
        with:
          name: bukur-db-backup-${{ github.run_id }}
          path: backups/
          retention-days: 90
